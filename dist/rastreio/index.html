<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f3b38">
  <meta name="description" content="Acompanhe a entrega do seu relógio Sanda Brasil.">
  <title>Rastreio | Sanda Brasil</title>
  <link rel="icon" type="image/png" href="../assets/sanda-logo-transparente.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bentham&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../site.css">
</head>
<body class="page-top">
  <main class="simple">
    <span class="eyebrow">Acompanhe seu pedido</span>
    <h1>Onde está o seu Sanda?</h1>
    <p>Digite o código de rastreio que enviamos por e-mail após a postagem do pedido.</p>
    <form class="track-form" id="tracking-form">
      <label class="sr-only" for="tracking-code">Código de rastreio</label>
      <input id="tracking-code" type="text" placeholder="Ex.: AA123456789BR" autocomplete="off" required>
      <button class="btn btn--dark" type="submit">Rastrear</button>
    </form>
    <small>Ainda não recebeu o código? Ele chega por e-mail assim que o pedido é postado. Se precisar, fale com a gente pelo <a href="#contato">atendimento</a>.</small>
  </main>

  <script src="../store-config.js"></script>
  <script src="../site.js"></script>
  <script>
    document.querySelector('#tracking-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const code = document.querySelector('#tracking-code').value.trim().toUpperCase();
      if (code) window.open('https://rastreamento.correios.com.br/app/index.php?objetos=' + encodeURIComponent(code), '_blank', 'noopener');
    });
  </script>
</body>
</html>
